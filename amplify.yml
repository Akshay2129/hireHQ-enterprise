version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 18.20.3
        - nvm use 18.20.3
        - npm ci --cache .npm --prefer-offline --legacy-peer-deps
    build:
      commands:
        - if [ "${AWS_BRANCH}" = "development" ]; then export BFLAG=build; fi
        - if [ "${AWS_BRANCH}" = "local" ]; then export BFLAG=build; fi
        - if [ "${AWS_BRANCH}" = "qa" ]; then export BFLAG=build-qa; fi
        - if [ "${AWS_BRANCH}" = "uat" ]; then export BFLAG=build-uat; fi
        - if [ "${AWS_BRANCH}" = "master" ]; then export BFLAG=build-matser; fi
        - npm run ${BFLAG}
  artifacts:
    baseDirectory: dist/hirehq-candidate-web
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
