<div class="sm:col-span-12 md:col-span-6 flex items-center lg:px-20 mt-10">
  <div class="w-full px-4 sm:px-6 py-8 sm:py-10 md:py-16 lg:px-16">
    <!-- Header -->
    <h1 class="text-base sm:text-lg md:text-xl lg:text-xl font-semibold text-gray-800 mb-2 sm:mb-4 mt-2">
      Welcome to hireHQ
    </h1>
    <p class="text-gray-600 text-sm sm:text-base mb-6 sm:mb-6">
      Please fill your login details in the fields below.
    </p>

    <!-- Form -->
    <form class="space-y-4 sm:space-y-6" action="" [formGroup]="loginForm" >
      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">
          Email Address
        </label>
        <input type="text" id="email"
          class="mt-1 block w-full px-3 py-2 border focus:outline-none focus:border-gray-600 hover:border-blue-800 rounded-sm shadow-sm text-gray-900"
          placeholder="Enter email address" formControlName="email" />
          <div class="relative h-1">
        <span class="text-red-500 text-sm" *ngIf="email?.invalid && email?.touched">
          Please enter email address
        </span>
      </div>
      </div>

      <!-- Password -->
      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">
          Password
        </label>
        <div class="relative">
          <input [type]="isPasswordVisible ? 'text' : 'password'" id="password"
            class="mt-1 block w-full px-3 py-2 border focus:outline-none focus:border-gray-600 hover:border-blue-800 rounded-sm shadow-sm text-gray-900"
            placeholder="Enter password" formControlName="password" />
          <button type="button" class="absolute right-3 top-2 text-gray-500 focus:outline-none"
            (click)="togglePasswordVisibility()">
            <i [class]="isPasswordVisible ? 'pi pi-eye text-gray-400' : 'pi pi-eye-slash text-gray-400'"></i>

          </button>

        </div>
        <div class="relative h-1">
          <span class="text-red-500 text-sm" *ngIf="password?.hasError('minlength') && password?.touched">
            Password must be at least 8 characters
          </span>
          <span class="text-red-500 text-sm" *ngIf="password?.hasError('required') && password?.touched">
            Please enter a password
          </span>
        </div>
      </div>
      <!-- Remember Me and Forgot Password -->
      <div class="flex items-center justify-between my-3">
        <div class="flex items-center">
          <input type="checkbox" id="rememberMe" class="h-4 w-4 text-indigo-600 border-gray-300 rounded-sm" />
          <label for="rememberMe" class="ml-2 text-sm text-gray-700">
            Remember Me
          </label>
        </div>
        <a href="#" class="text-blue-700 text-sm hover:underline" [routerLink]="['/auth/forgot-password']"
          routerLinkActive="router-link-active">Forgot Password?</a>
      </div>

      <!-- Buttons -->
      <button type="submit"
        class="w-full bg-indigo-950 text-white text-sm font-medium py-2 rounded-md hover:bg-indigo-700 cursor-pointer " (click)="loginuser()">
        Sign in
      </button>
      <button type="button"
        class="w-full bg-gray-100 text-black text-sm sm:text-base font-medium py-2 px-4 rounded-md shadow hover:bg-gray-200"
        (click)="onClickCreateAccout()">
        Create New Account
      </button>
    </form>
  </div>
</div>
