<div class="flex items-center justify-center min-h-screen ">
  <div class="w-full max-w-sm p-6 ">
    <h2 class="text-xl font-semibold text-gray-800">Set new password</h2>
    <p class="text-sm text-gray-500">Please fill the below field to set your new password</p>

    <form class="mt-4">
      <!-- New Password -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">New password</label>
        <div class="relative mt-1">
          <input [type]="isPasswordVisible ? 'text' : 'password'" placeholder="Enter new password"
            class="w-full px-4 py-2 pr-10 text-gray-700 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            required />
          <button type="button" class="absolute inset-y-0 right-3 flex items-center text-gray-500 focus:outline-none"
            (click)="togglePasswordVisibility()">
            <i [class]="isPasswordVisible ? 'pi pi-eye text-gray-400' : 'pi pi-eye-slash text-gray-400'"></i>

          </button>
        </div>

      </div>

      <!-- Confirm Password -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Confirm new password</label>
        <div class="relative mt-1">
          <input [type]="isConfirmPasswordVisible ? 'text' : 'password'" placeholder="Enter new password again"
            class="w-full px-4 py-2 pr-10 text-gray-700 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            required />
          <button type="button" class="absolute inset-y-0 right-3 flex items-center text-gray-500 focus:outline-none"
            (click)="confirmPasswordVisible()">
            <i [class]="isConfirmPasswordVisible ? 'pi pi-eye' : 'pi pi-eye-slash'"></i>
          </button>
        </div>

      </div>

      <!-- Submit Button -->
      <button type="submit"
        class="w-full px-4 py-2 text-white bg-indigo-900 rounded-lg hover:bg-indigo-800 focus:outline-none"
        (click)="passwordSucess()">
        Create Password
      </button>
    </form>
  </div>
</div>
