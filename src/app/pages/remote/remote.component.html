<div class="flex h-screen">
    <!-- Sidebar -->
    <nav [class.w-64]="!isSidebarCollapsed" [class.w-16]="isSidebarCollapsed"
        class="bg-gray-100 h-full transition-all duration-300 border-r border-gray-300">
        <!-- Sidebar Header -->
        <div class="flex items-center gap-2 p-4">
            <button class="text-gray-500 hover:text-gray-600 focus:outline-none" (click)="toggleSidebar()">
                <i class="pi pi-bars text-lg"></i>
            </button>
            <div [class.hidden]="isSidebarCollapsed" class="text-xl font-semibold text-black">
                hireHQ
            </div>
        </div>

        <ul class="mt-4">
            <li *ngFor="let item of menuItems; let i = index" [routerLink]="item.route" [routerLinkActive]="'bg-none'"
                class="flex items-center gap-2 p-3 transition-colors cursor-pointer hover:font-semibold" [ngClass]="{
                    'border-l-8 border-blue-900 pl-2 bg-purple-100': currentIndex === i,
                    'pl-3 hover:bg-gray-200': currentIndex !== i
                }" (click)="currentIndex = i">
                <span class="text-gray-400 flex-shrink-0"> <i [ngClass]="item.icon"></i> </span>
                <span [class.hidden]="isSidebarCollapsed"
                    [ngClass]="{ 'font-semibold text-purple-900': currentIndex === i,'hover:text-purple-950': currentIndex !== i }"
                    class="text-black text-sm">
                    {{ item.label }}
                </span>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="flex-1 bg-gray-100 p-4 overflow-auto">
        <app-nav-menu></app-nav-menu>
        <router-outlet></router-outlet>
    </div>
</div>
